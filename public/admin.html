<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理员后台 - DreamAPI AI 生图</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(15, 23, 42, .82);
      --text: #e5edf8;
      --muted: #93a4b8;
      --line: rgba(148, 163, 184, .22);
      --blue: #4f8cff;
      --red: #fb7185;
      --green: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 0 0 24px; }
    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: var(--panel);
      padding: 32px;
      border-radius: 16px;
      border: 1px solid var(--line);
    }
    .login-box h2 { margin: 0 0 24px; text-align: center; }
    input, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(2, 6, 23, .5);
      color: var(--text);
      font-size: 14px;
    }
    button {
      background: linear-gradient(135deg, var(--blue), #2563eb);
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 16px;
    }
    .card-prompt {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      margin: 0 0 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .delete-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--red), #e11d48);
      padding: 8px;
      margin: 0;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }
    .status.error { background: rgba(251, 113, 133, 0.2); color: var(--red); }
    .status.success { background: rgba(52, 211, 153, 0.2); color: var(--green); }
    .hidden { display: none; }
    .load-more {
      text-align: center;
      margin: 32px 0;
    }
    .load-more button {
      width: auto;
      min-width: 200px;
    }
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 8px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginBox" class="login-box">
      <h2>🔐 管理员登录</h2>
      <input id="password" type="password" placeholder="请输入管理员密码" />
      <button id="loginBtn">登录</button>
      <div id="loginStatus" class="status hidden"></div>
    </div>

    <div id="adminPanel" class="hidden">
      <h1>🎨 画廊管理</h1>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="totalCount">0</div>
          <div class="stat-label">总作品数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="totalLikes">0</div>
          <div class="stat-label">总点赞数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="totalViews">0</div>
          <div class="stat-label">总浏览数</div>
        </div>
      </div>
      <div id="status" class="status hidden"></div>
      <div id="gallery" class="grid"></div>
      <div id="loadMoreWrap" class="load-more hidden">
        <button id="loadMoreBtn">加载更多</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/gallery';
    let password = '';
    let items = [];
    let offset = 0;
    let hasMore = true;
    const limit = 12;

    const $ = (id) => document.getElementById(id);
    const loginBox = $('loginBox');
    const adminPanel = $('adminPanel');
    const loginBtn = $('loginBtn');
    const passwordInput = $('password');
    const loginStatus = $('loginStatus');
    const gallery = $('gallery');
    const status = $('status');
    const loadMoreBtn = $('loadMoreBtn');
    const loadMoreWrap = $('loadMoreWrap');

    function showStatus(msg, type = 'error', target = status) {
      target.textContent = msg;
      target.className = `status ${type}`;
      setTimeout(() => target.classList.add('hidden'), 3000);
    }

    async function login() {
      const pwd = passwordInput.value.trim();
      if (!pwd) {
        showStatus('请输入密码', 'error', loginStatus);
        return;
      }
      
      loginBtn.disabled = true;
      loginBtn.textContent = '验证中...';
      
      try {
        const resp = await fetch(`${API_BASE}?limit=1`, {
          headers: { 'X-Admin-Password': pwd }
        });
        const data = await resp.json();
        
        if (!resp.ok) {
          throw new Error(data.error || '密码错误');
        }
        
        password = pwd;
        localStorage.setItem('admin_password', password);
        loginBox.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
        loadGallery();
      } catch (err) {
        showStatus(err.message || '登录失败', 'error', loginStatus);
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
      }
    }

    async function loadGallery(append = false) {
      if (!password) {
        throw new Error('未登录或管理员密码丢失，请重新登录。');
      }
      if (!append) {
        offset = 0;
        items = [];
        gallery.innerHTML = '<p style="text-align:center;color:var(--muted);">加载中...</p>';
      }
      
      try {
        const resp = await fetch(`${API_BASE}?sort=new&limit=${limit}&offset=${offset}`, {
          headers: {
            'X-Admin-Password': password
          }
        });
        const data = await resp.json();
        
        if (!resp.ok) throw new Error(data.error || '加载失败');
        
        items = append ? [...items, ...data.items] : data.items;
        hasMore = data.hasMore;
        offset += data.items.length;
        
        renderGallery();
        updateStats(data.total);
        
        loadMoreWrap.classList.toggle('hidden', !hasMore);
      } catch (err) {
        showStatus(err.message || '加载失败', 'error');
      }
    }

    function updateStats(total) {
      $('totalCount').textContent = total;
      const totalLikes = items.reduce((sum, item) => sum + item.likes, 0);
      const totalViews = items.reduce((sum, item) => sum + item.views, 0);
      $('totalLikes').textContent = totalLikes;
      $('totalViews').textContent = totalViews;
    }

    function renderGallery() {
      gallery.innerHTML = items.map(item => `
        <div class="card" data-id="${item.id}">
          <img src="${item.imageUrl}" alt="${item.prompt}" />
          <div class="card-body">
            <p class="card-prompt">${escapeHtml(item.prompt)}</p>
            <div class="card-meta">
              <span>❤️ ${item.likes}</span>
              <span>👁️ ${item.views}</span>
            </div>
            <button class="delete-btn" onclick="deleteItem('${item.id}')">🗑️ 删除</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteItem(id) {
      if (!confirm('确定要删除这张图片吗？此操作不可恢复。')) return;
      
      try {
        const resp = await fetch(`${API_BASE}/${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Password': password
          }
        });
        
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || '删除失败');
        
        items = items.filter(item => item.id !== id);
        renderGallery();
        showStatus('删除成功', 'success');
        
        // 更新统计
        const total = parseInt($('totalCount').textContent) - 1;
        updateStats(total);
      } catch (err) {
        showStatus(err.message || '删除失败', 'error');
      }
    }

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    }

    loginBtn.onclick = login;
    passwordInput.onkeydown = (e) => { if (e.key === 'Enter') login(); };
    loadMoreBtn.onclick = () => loadGallery(true);

    // 自动登录
    const savedPassword = localStorage.getItem('admin_password');
    if (savedPassword) {
      passwordInput.value = savedPassword;
      login();
    }
  </script>
</body>
</html>
