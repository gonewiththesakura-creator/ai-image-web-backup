services:
  ai-image-web:
    build: .
    container_name: ai-image-web
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - PORT=3001
      - SUB2API_BASE_URL=http://sub2api:8080/v1
      - IMAGE_MODEL=gpt-image-2
      - MAX_PROMPT_LENGTH=4000
      - REQUEST_TIMEOUT_MS=300000
      - DATA_DIR=/app/data
      - GALLERY_MAX_IMAGE_WIDTH=1280
      - GALLERY_MAX_IMAGE_HEIGHT=1280
      - GALLERY_WEBP_QUALITY=78
      - TRIAL_API_KEY=sk-e4aeba2e12f404252e670413436795a3e91efa3fad0c040defc02c6e8155daff
      - ADMIN_PASSWORD=admin123456
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - sub2api_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sub2api_net:
    external: true
    name: suapi-deployment_default
